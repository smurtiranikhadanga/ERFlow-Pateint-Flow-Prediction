services:
  # 1. FastAPI Backend ML & Chatbot Service
  - type: web
    name: erflow-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r chatbot/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PYTHONPATH
        value: .

  # 2. React + Vite Dashboard Static Site
  - type: web
    name: erflow-frontend
    env: static
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
